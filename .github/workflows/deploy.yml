name: Publicar no GitHub Pages

# main              → versão real:  https://vinicius-leon10.github.io/jogo-infantil-igles/
# claude/sprout-app → versão teste: https://vinicius-leon10.github.io/jogo-infantil-igles/teste/
on:
  push:
    branches: [main, claude/sprout-app]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, never cancelled, so the two sites never overwrite each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Regression suite: nothing is published (test or real) unless every test passes.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref_name == 'main' && 'producao' || 'teste' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SPROUT_ENV: ${{ env.TARGET }}
      - name: Atualizar o branch gh-pages
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ! git clone -q --depth 1 --branch gh-pages "$REMOTE" site; then
            mkdir site && git -C site init -q -b gh-pages && git -C site remote add origin "$REMOTE"
          fi
          if [ "$TARGET" = "producao" ]; then
            # Replace everything except the test site.
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name teste -exec rm -rf {} +
            cp -r dist/. site/
          else
            rm -rf site/teste && mkdir site/teste && cp -r dist/. site/teste/
            # Its own name on the home screen, so the two installed apps are easy to tell apart.
            sed -i 's/"name": "Sprout · Aprenda inglês"/"name": "Sprout TESTE"/; s/"short_name": "Sprout"/"short_name": "Sprout TESTE"/' site/teste/manifest.webmanifest
            sed -i 's/content="Sprout" \/>/content="Sprout TESTE" \/>/' site/teste/index.html
          fi
          touch site/.nojekyll
          cd site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publicar $TARGET ${GITHUB_SHA::7}" || { echo "Nada mudou"; exit 0; }
          git push -q origin gh-pages
